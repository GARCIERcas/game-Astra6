<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#20202a" />
    <title>ASTRA-6</title>
    <script type="module" crossorigin src="./assets/index-Czfx9hkZ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CTc230zl.css">
  </head>
  <body>
    <main id="view">
      <canvas id="scene" aria-hidden="true"></canvas>
      <canvas id="cover" aria-hidden="true"></canvas>
      <canvas id="hud" aria-hidden="true"></canvas>
      <section id="menu" aria-label="Меню полёта">
        <h1 aria-label="ASTRA-6">
          <canvas
            id="wordmark"
            width="66"
            height="14"
            aria-hidden="true"
          ></canvas>
        </h1>
        <div class="menu-controls">
          <label for="mode">Режим полёта</label>
          <select id="mode">
            <option>Маршрут через кольца</option>
            <option>Свободный полёт</option>
          </select>
          <button id="fly">Вылет <kbd>Пробел</kbd></button>
        </div>
        <nav aria-label="Настройки">
          <button id="help">Управление</button
          ><button id="sound" aria-pressed="false">Звук выкл.</button>
        </nav>
      </section>
      <div id="instruments" aria-label="Приборы шлема">
        <div class="readings">
          <span id="route"></span><span>Тяга <b id="thrust"></b></span
          ><span id="load"></span>
        </div>
        <div class="clock">
          <time id="clock">00:00</time><button id="pause">Пауза</button>
        </div>
      </div>
      <div id="status" role="status"></div>
      <div id="touch" aria-label="Управление самолётом"></div>
    </main>
    <dialog id="dialog">
      <h2>Управление</h2>
      <p>
        На маршруте пройди восемь колец по порядку. Ромб у края визора
        показывает направление к следующему.
      </p>
      <dl>
        <dt>W / S · ↑ / ↓</dt>
        <dd>Нос вниз / вверх</dd>
        <dt>A / D · ← / →</dt>
        <dd>Крен</dd>
        <dt>Q / E</dt>
        <dd>Рыскание</dd>
        <dt>Shift / Ctrl</dt>
        <dd>Тяга больше / меньше</dd>
        <dt>Пробел</dt>
        <dd>Вылет / пауза</dd>
      </dl>
      <button id="close">Назад</button>
    </dialog>
  </body>
</html>
